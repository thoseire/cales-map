<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    background: #070914;
    color: #eeeaff;
    font-family: Georgia, "Times New Roman", serif;
    overflow-x: hidden;
}

/* =========================
   BACKGROUND
========================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.45;

    background-image:
        radial-gradient(
            circle,
            white 0 1px,
            transparent 1.5px
        );

    background-size: 90px 90px;
}


/* =========================
   MAIN
========================= */

.archive {
    min-height: 100vh;
    padding: 28px 24px 35px;

    background:
        radial-gradient(
            circle at center,
            rgba(93, 82, 155, 0.16),
            transparent 48%
        ),
        #070914;
}


/* =========================
   HEADER
========================= */

header {
    text-align: center;
}

.kicker {
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.5;
}

h1 {
    margin: 9px 0 4px;

    font-size: clamp(30px, 4vw, 52px);
    font-weight: normal;
    letter-spacing: 7px;
}

.subtitle {
    font-size: 13px;
    font-style: italic;
    opacity: 0.55;
}


/* =========================
   CYCLE NAVIGATION
========================= */

.cycle-navigation {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;

    margin: 22px auto 10px;
}

.nav-button {
    width: 34px;
    height: 34px;

    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.18);

    background: rgba(255,255,255,0.04);
    color: white;

    cursor: pointer;
    font-size: 19px;

    transition:
        background 0.2s ease,
        transform 0.2s ease;
}

.nav-button:hover {
    background: rgba(255,255,255,0.1);
    transform: scale(1.05);
}

.cycle-title {
    min-width: 230px;
    text-align: center;
}

.cycle-title strong {
    display: block;

    font-size: 18px;
    font-weight: normal;
    letter-spacing: 4px;
}

.cycle-title span {
    display: block;

    margin-top: 4px;

    font-family: Arial, sans-serif;
    font-size: 9px;
    letter-spacing: 2.5px;

    opacity: 0.4;
    text-transform: uppercase;
}


/* =========================
   MONTH SUB TABS
========================= */

.month-tabs {
    display: flex;
    justify-content: center;
    gap: 7px;

    margin: 15px auto 12px;

    flex-wrap: wrap;
}

.month-tab {
    border: 1px solid rgba(255,255,255,0.09);

    background: rgba(255,255,255,0.025);

    color: rgba(255,255,255,0.45);

    padding: 7px 13px;

    font-family: Arial, sans-serif;
    font-size: 9px;
    letter-spacing: 2px;

    text-transform: uppercase;

    cursor: pointer;

    transition:
        color 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
}

.month-tab:hover {
    color: white;
    background: rgba(255,255,255,0.07);
}

.month-tab.active {
    color: white;

    background:
        rgba(255,255,255,0.09);

    border-color:
        rgba(255,255,255,0.25);
}


/* =========================
   MAP
========================= */

.map-container {
    width: min(1100px, 94vw);

    aspect-ratio: 16 / 9;

    margin: 0 auto;

    position: relative;
}

.map {
    position: absolute;
    inset: 0;

    overflow: hidden;

    border: 1px solid rgba(255,255,255,0.08);

    border-radius: 18px;

    background:
        radial-gradient(
            ellipse at center,
            rgba(100,90,160,0.12),
            transparent 62%
        );
}


/* Decorative rings */

.map::before {
    content: "";

    position: absolute;

    width: 72%;
    height: 72%;

    left: 14%;
    top: 14%;

    border:
        1px solid rgba(255,255,255,0.035);

    border-radius: 50%;

    transform:
        rotate(18deg);
}

.map::after {
    content: "";

    position: absolute;

    width: 48%;
    height: 48%;

    left: 26%;
    top: 26%;

    border:
        1px solid rgba(255,255,255,0.025);

    border-radius: 50%;

    transform:
        rotate(-25deg);
}


/* =========================
   MONTH LABEL
========================= */

.map-month-title {
    position: absolute;

    top: 22px;
    left: 28px;

    font-family: Arial, sans-serif;

    font-size: 10px;
    letter-spacing: 4px;

    opacity: 0.38;

    text-transform: uppercase;

    z-index: 5;
}


/* =========================
   SVG
========================= */

svg {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: visible;

    z-index: 3;
}


/* =========================
   CONSTELLATION LINES
========================= */

.constellation-line {
    stroke:
        rgba(220,215,255,0.28);

    stroke-width: 1.15;

    stroke-dasharray:
        2 6;

    vector-effect:
        non-scaling-stroke;

    pointer-events: none;
}

.constellation-line.main-line {
    stroke:
        rgba(225,220,255,0.4);

    stroke-width: 1.3;

    stroke-dasharray:
        3 5;
}


/* =========================
   STARS
========================= */

.star {
    cursor: pointer;

    transform-box: fill-box;
    transform-origin: center;

    transition:
        filter 0.2s ease;
}


/*
   IMPORTANT:
   No transform animation on hover.

   This prevents the previous
   "shaking / vibrating" problem.
*/

.star:hover {
    filter:
        drop-shadow(0 0 7px currentColor)
        drop-shadow(0 0 16px currentColor);
}

.star-core {
    transition:
        r 0.2s ease;
}

.star:hover .star-core {
    opacity: 0.95;
}


/* =========================
   STAR LABEL
========================= */

.star-label {
    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 1px;

    fill: rgba(255,255,255,0.6);

    pointer-events: none;

    opacity: 0;

    transition:
        opacity 0.2s ease;
}

.star:hover .star-label {
    opacity: 1;
}


/* =========================
   MODAL
========================= */

.modal {
    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(3,4,10,0.82);

    backdrop-filter:
        blur(8px);

    z-index: 100;
}

.modal.active {
    display: flex;
}


/* =========================
   PROFILE
========================= */

.profile {
    width: min(720px, 94vw);

    display: grid;

    grid-template-columns:
        230px 1fr;

    position: relative;

    background:
        linear-gradient(
            135deg,
            #121426,
            #090b15

    border:
        1px solid rgba(255,255,255,0.15);

    box-shadow:
        0 30px 100px rgba(0,0,0,0.6);

/* =========================
   PORTRAIT
========================= */

.portrait {
    min-height: 310px;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle,
            rgba(120,110,190,0.2),
            transparent 60%

    overflow: hidden;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 2px;

    color:

}

.portrait img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: none;
}

.portrait.has-image img {
    display: block;
}

.portrait.has-image .portrait-placeholder {
    display: none;
}


/* =========================
   PROFILE CONTENT
========================= */

.profile-content {
    padding: 40px;
}

.close {
    position: absolute;

    right: 14px;
    top: 9px;

    border: none;

    background: none;

    color: white;

    font-size: 24px;

    opacity: 0.55;

    cursor: pointer;

    z-index: 5;
}

.close:hover {
    opacity: 1;

.rank {

.profile h2 {

.profile-info {

/* =========================

========================= */

    }

        max-height: 240px;
    }

    .profile-content {
        padding: 28px;
    }

/* =====================================================
   COLORS

   Rank 1 = blue
   Rank 2 = orange
   Rank 3 = red
   Rank 0 = white
===================================================== */

const stellarColors = {

    BLUE:
        "#72b7ff",

    ORANGE:
        "#ffad5c",

    RED:
        "#ff625f",

    WHITE:
        "#dbe7ff"

};


/* =====================================================
   URSA MINOR CONNECTIONS

   Main seven-star structure:

   Polaris
      |
   Yildun
      |
   Epsilon
      |
      +--- Kochab
          |
          Zeta
          |
          Eta
          |
        Pherkad

   Additional stars are only loosely connected.
===================================================== */

const constellationLines = {

    June: [

        /*
           HANDLE
        */

        [0, 3, true],

        [3, 4, true],

        [4, 1, true],


        /*
           BOWL
        */

        [1, 5, true],

        [5, 2, true],

        [2, 6, true],

        [6, 1, true],


        /*
           SUPPORTING STARS
        */

        [4, 7, false],

        [5, 8, false],

        [2, 9, false]

    ]

};


/* =====================================================

===================================================== */

const svg =

const monthTabs =

/* =====================================================
   GET STUDENTS FOR MONTH
===================================================== */

function getMonthStudents(month) {

    return students.filter(
        student =>
            student.month === month
    );

}


/* =====================================================
   DRAW CONSTELLATION
===================================================== */

function drawConstellation() {

    svg.innerHTML = "";

    const monthStudents =
        getMonthStudents(currentMonth);


    /*
       Current month's local index
    */

    const indexMap =
        new Map();

    monthStudents.forEach(
        (student, index) => {

            indexMap.set(
                student.name,
                index
            );

        }
    );


    /*
       Draw lines
    */

    const lines =
        constellationLines[currentMonth] || [];


    lines.forEach(
        connection => {

            const [
                a,
                b,
                isMain
            ] = connection;


            const studentA =
                monthStudents[a];

            const studentB =
                monthStudents[b];


            if (
                !studentA ||
                !studentB
            ) return;


            const line =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "line"
                );


            line.setAttribute(
                "x1",
                studentA.x
            );

            line.setAttribute(
                "y1",
                studentA.y
            );

            line.setAttribute(
                "x2",
                studentB.x
            );

            line.setAttribute(
                "y2",
                studentB.y
            );


            line.setAttribute(
                "class",
                isMain
                    ? "constellation-line main-line"
                    : "constellation-line"
            );


            svg.appendChild(line);

        }
    );


    /*
       Draw stars
    */

    monthStudents.forEach(
        student => {

            const group =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "g"
                );


            group.setAttribute(
                "class",
                "star"
            );


            group.style.color =
                stellarColors[
                    student.type
                ];


            group.setAttribute(
                "transform",
                `translate(${student.x}, ${student.y})`
            );


            /*
               Rank sizing
            */

            const glowRadius =
                student.rank === 1
                    ? 18
                    : student.rank === 2
                    ? 15
                    : student.rank === 3
                    ? 13
                    : 8;


            const starRadius =
                student.rank === 1
                    ? 8
                    : student.rank === 2
                    ? 6.5
                    : student.rank === 3
                    ? 5.5
                    : 3.3;


            /*
               Glow
            */

            const glow =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "circle"
                );


            glow.setAttribute(
                "r",
                glowRadius
            );

            glow.setAttribute(
                "fill",
                stellarColors[
                    student.type
                ]
            );

            glow.setAttribute(
                "opacity",
                student.rank
                    ? "0.16"
                    : "0.055"
            );


            /*
               Actual star
            */

            const star =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "circle"
                );


            star.setAttribute(
                "class",
                "star-core"
            );


            star.setAttribute(
                "r",
                starRadius
            );

            star.setAttribute(
                "fill",
                stellarColors[
                    student.type
                ]
            );

            star.setAttribute(
                "stroke",
                "rgba(255,255,255,0.8)"
            );

            star.setAttribute(
                "stroke-width",
                "1"
            );


            /*
               Label

               Only appears on hover.
            */

            const label =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "text"
                );


            label.setAttribute(
                "class",
                "star-label"
            );

            label.setAttribute(
                "x",
                11
            );

            label.setAttribute(
                "y",
                3
            );

            label.textContent =
                student.name;


            group.appendChild(
                glow
            );

            group.appendChild(
                star
            );

            group.appendChild(
                label
            );


            /*
               Click
            */

            group.addEventListener(
                "click",
                () =>
                    openProfile(student)
            );


            svg.appendChild(
                group
            );

        }
    );

}


/* =====================================================
   MONTH TABS
===================================================== */

function renderMonthTabs() {

    monthTabs.innerHTML = "";

    const cycle =
        cycles[currentCycle];


    cycle.months.forEach(
        month => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "month-tab";


            if (
                month === currentMonth
            ) {

                button.classList.add(
                    "active"
                );

            }


            button.textContent =
                month;


            button.addEventListener(
                "click",
                () => {

                    currentMonth =
                        month;

                    renderMonthTabs();

                    updateMonthTitle();

                    drawConstellation();

                }
            );


            monthTabs.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   MONTH TITLE
===================================================== */

function updateMonthTitle() {

    const constellationName =
        currentMonth === "June"
            ? " · Ursa Minor"
            : "";

    mapMonthTitle.textContent =
        currentMonth +
        constellationName;

}


/* =====================================================
   CYCLE
===================================================== */

function updateCycle() {

    const cycle =
        cycles[currentCycle];


    document.getElementById(
        "cycle-name"
    ).textContent =
        cycle.name;


    document.getElementById(
        "cycle-date"
    ).textContent =
        cycle.date;


    /*
       Keep current month inside
       the selected cycle.
    */

    if (
        !cycle.months.includes(
            currentMonth
        )
    ) {

        currentMonth =
            cycle.months[0];

    }


    renderMonthTabs();

    updateMonthTitle();

    drawConstellation();

}


/* =====================================================
   PREVIOUS CYCLE
===================================================== */

document
    .getElementById("previous")
    .addEventListener(
        "click",
        () => {

            currentCycle--;

            if (
                currentCycle < 0
            ) {

                currentCycle =
                    cycles.length - 1;

            }

            updateCycle();

        }
    );


/* =====================================================
   NEXT CYCLE
===================================================== */

document
    .getElementById("next")
    .addEventListener(
        "click",
        () => {

            currentCycle++;

            if (
                currentCycle >=
                cycles.length
            ) {

                currentCycle = 0;

            }

            updateCycle();

        }
    );


/* =====================================================
   PROFILE
===================================================== */

const modal =
    document.getElementById(
        "modal"
    );


function openProfile(student) {

    document.getElementById(
        "profile-name"
    ).textContent =
        student.name;


    document.getElementById(
        "profile-rank"
    ).textContent =
        student.rank
            ? `Rank #${String(student.rank).padStart(2, "0")} · ${student.month} 2026`
            : `Recorded Star · ${student.month} 2026`;


    /*
       Rank 0 gets short identity.

       Bright stars get more detail.
    */

    if (
        student.rank === 0
    ) {

        document.getElementById(
            "profile-info"
        ).innerHTML =

            `${student.identity}`;

    } else {

        document.getElementById(
            "profile-info"
        ).innerHTML =

            `${student.identity}<br>
             Stellar Class:
             <strong
                 style="
                 color:${stellarColors[student.type]}
                 ">
                 ${student.type}
             </strong>`;

    }


    document.getElementById(
        "profile-quote"
    ).textContent =
        `“${student.quote}”`;


    /*
       Photo
    */

    const portrait =
        document.getElementById(
            "portrait"
        );

    const image =
        document.getElementById(
            "portrait-image"
        );


    portrait.classList.remove(
        "has-image"
    );


    image.removeAttribute(
        "src"
    );


    /*
       Only Rank 1–3 use photos.
    */

    if (
        student.rank &&
        student.photo
    ) {

        image.onload =
            () => {

                portrait.classList.add(
                    "has-image"
                );

            };


        image.src =
            student.photo;

    }


    modal.classList.add(
        "active"
    );

}


/* =====================================================
   CLOSE
===================================================== */

document
    .getElementById("close")
    .addEventListener(
        "click",
        () => {

            modal.classList.remove(
                "active"
            );

        }
    );


modal.addEventListener(
    "click",
    event => {

        if (
            event.target === modal
        ) {

            modal.classList.remove(
                "active"
            );

        }

    }
);


/* =====================================================
   INITIALIZE
===================================================== */

updateCycle();

</script>
