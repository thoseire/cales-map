<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Celestial Archive</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #070914;
    color: #eeeaff;
    font-family: Georgia, "Times New Roman", serif;
    overflow-x: hidden;
}


/* =====================================================
   BACKGROUND
===================================================== */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.45;

    background-image:
        radial-gradient(circle, white 0 1px, transparent 1.5px);

    background-size: 90px 90px;
}


/* =====================================================
   MAIN
===================================================== */

.archive {
    min-height: 100vh;
    padding: 40px 30px 60px;

    background:
        radial-gradient(
            circle at center,
            rgba(93, 82, 155, 0.18),
            transparent 50%
        ),
        #070914;
}


/* =====================================================
   HEADER
===================================================== */

header {
    text-align: center;
}

.kicker {
    font-family: Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.5;
}

h1 {
    margin: 12px 0 5px;

    font-size: clamp(35px, 6vw, 65px);
    font-weight: normal;
    letter-spacing: 8px;
}

.subtitle {
    font-size: 15px;
    font-style: italic;
    opacity: 0.6;
}


/* =====================================================
   CYCLE NAVIGATION
===================================================== */

.cycle-navigation {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;

    margin: 35px auto 25px;
}

.nav-button {
    width: 40px;
    height: 40px;

    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);

    background: rgba(255,255,255,0.04);
    color: white;

    cursor: pointer;
    font-size: 20px;

    transition: 0.2s ease;
}

.nav-button:hover {
    background: rgba(255,255,255,0.12);
    transform: scale(1.05);
}

.cycle-title {
    min-width: 250px;
    text-align: center;
}

.cycle-title strong {
    display: block;

    font-size: 20px;
    font-weight: normal;
    letter-spacing: 4px;
}

.cycle-title span {
    display: block;

    margin-top: 6px;

    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 3px;

    opacity: 0.45;
    text-transform: uppercase;
}


/* =====================================================
   MONTH DISPLAY
===================================================== */

.month-display {
    text-align: center;
    margin-bottom: 12px;
}

.month-display h2 {
    margin: 0;

    font-size: 30px;
    font-weight: normal;

    letter-spacing: 7px;
}

.month-display p {
    margin: 7px 0 0;

    font-family: Arial, sans-serif;
    font-size: 9px;
    letter-spacing: 3px;

    opacity: 0.4;
    text-transform: uppercase;
}


/* =====================================================
   SKY MAP
===================================================== */

.map-container {
    width: min(1100px, 94vw);

    /*
       Lebih lebar daripada tinggi,
       tapi tidak terlalu gepeng.
    */

    aspect-ratio: 1.65 / 1;

    margin: 0 auto;

    position: relative;
}

.map {
    position: absolute;
    inset: 0;

    overflow: hidden;

    border: 1px solid rgba(255,255,255,0.08);

    border-radius: 24px;

    background:
        radial-gradient(
            ellipse at center,
            rgba(100,90,160,0.13),
            transparent 62%
        ),
        radial-gradient(
            circle at 20% 30%,
            rgba(100,130,210,0.05),
            transparent 25%
        ),
        #090c19;
}


/* =====================================================
   CELESTIAL GRID
===================================================== */

.map::before {
    content: "";

    position: absolute;
    inset: 7%;

    border: 1px solid rgba(255,255,255,0.035);

    border-radius: 50%;

    transform: rotate(15deg);
}

.map::after {
    content: "";

    position: absolute;

    width: 70%;
    height: 70%;

    left: 15%;
    top: 15%;

    border: 1px solid rgba(255,255,255,0.025);

    border-radius: 50%;

    transform: rotate(-22deg);
}


/* =====================================================
   MONTH CORNER
===================================================== */

.month-corner {
    position: absolute;

    left: 28px;
    top: 24px;

    z-index: 2;

    font-family: Arial, sans-serif;
    font-size: 9px;

    letter-spacing: 3px;

    opacity: 0.3;

    text-transform: uppercase;
}


/* =====================================================
   SVG
===================================================== */

svg {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 3;
}


/* =====================================================
   CONSTELLATION LINES
===================================================== */

.constellation-line {
    stroke: rgba(210,220,255,0.32);
    stroke-width: 1.2;

    stroke-dasharray: 3 6;

    fill: none;
}

.constellation-line.major {
    stroke: rgba(220,225,255,0.48);
    stroke-width: 1.5;

    stroke-dasharray: none;
}


/* =====================================================
   STARS
===================================================== */

.star {
    cursor: pointer;

    transform-box: fill-box;
    transform-origin: center;

    transition:
        transform 0.2s ease,
        filter 0.2s ease;
}

.star:hover {
    filter:
        drop-shadow(0 0 8px currentColor)
        drop-shadow(0 0 18px currentColor);

    transform: scale(1.35);
}


/* =====================================================
   RANK 0
===================================================== */

.recorded-star {
    opacity: 0.8;
}

.recorded-star:hover {
    opacity: 1;
}


/* =====================================================
   HOVER CARD
===================================================== */

.star-tooltip {
    position: fixed;

    z-index: 200;

    width: 230px;

    padding: 14px;

    pointer-events: none;

    background:
        linear-gradient(
            135deg,
            rgba(20,23,42,0.97),
            rgba(8,10,20,0.97)
        );

    border: 1px solid rgba(255,255,255,0.14);

    box-shadow:
        0 15px 50px rgba(0,0,0,0.55);

    backdrop-filter: blur(10px);

    opacity: 0;

    transform:
        translateY(6px);

    transition:
        opacity 0.15s ease,
        transform 0.15s ease;
}

.star-tooltip.visible {
    opacity: 1;

    transform:
        translateY(0);
}


/* Bright-star photo */

.tooltip-photo {
    width: 100%;
    height: 130px;

    object-fit: cover;

    display: block;

    margin-bottom: 12px;

    background:
        radial-gradient(
            circle,
            rgba(120,110,190,0.2),
            transparent 60%
        ),
        #101321;
}


/* Rank 0 has no photo */

.star-tooltip.simple {
    width: 210px;
}

.tooltip-rank {
    font-family: Arial, sans-serif;

    font-size: 8px;

    letter-spacing: 2px;

    text-transform: uppercase;

    opacity: 0.45;

    margin-bottom: 5px;
}

.tooltip-name {
    font-size: 18px;

    letter-spacing: 1px;

    margin-bottom: 5px;
}

.tooltip-identity {
    font-family: Arial, sans-serif;

    font-size: 10px;

    line-height: 1.6;

    opacity: 0.55;
}


/* =====================================================
   EMPTY MONTH
===================================================== */

.empty-month {
    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    z-index: 2;

    pointer-events: none;
}

.empty-month span {
    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 4px;

    text-transform: uppercase;

    opacity: 0.25;
}


/* =====================================================
   MODAL
===================================================== */

.modal {
    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(3,4,10,0.82);

    backdrop-filter: blur(8px);

    z-index: 100;
}

.modal.active {
    display: flex;
}


/* =====================================================
   PROFILE
===================================================== */

.profile {
    width: min(760px, 95vw);

    display: grid;

    grid-template-columns: 250px 1fr;

    position: relative;

    background:
        linear-gradient(
            135deg,
            #121426,
            #090b15
        );

    border: 1px solid rgba(255,255,255,0.15);

    box-shadow:
        0 30px 100px rgba(0,0,0,0.6);
}


/* =====================================================
   PORTRAIT
===================================================== */

.portrait {
    min-height: 330px;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    background:
        radial-gradient(
            circle,
            rgba(120,110,190,0.2),
            transparent 60%
        ),
        #101321;

    font-family: Arial, sans-serif;
    font-size: 10px;

    letter-spacing: 2px;

    color: rgba(255,255,255,0.35);
}

.portrait img {
    width: 100%;
    height: 100%;

    min-height: 330px;

    object-fit: cover;
}


/* =====================================================
   PROFILE CONTENT
===================================================== */

.profile-content {
    padding: 45px;
}

.close {
    position: absolute;

    right: 15px;
    top: 10px;

    border: none;
    background: none;

    color: white;

    font-size: 25px;

    opacity: 0.6;

    cursor: pointer;
}

.rank {
    font-family: Arial, sans-serif;
    font-size: 10px;

    letter-spacing: 2px;

    opacity: 0.5;

    text-transform: uppercase;
}

.profile h2 {
    margin: 10px 0;

    font-size: 32px;
    font-weight: normal;

    letter-spacing: 3px;
}

.profile-info {
    font-family: Arial, sans-serif;

    font-size: 12px;

    line-height: 2;

    opacity: 0.65;
}

.quote {
    margin-top: 25px;

    padding-top: 18px;

    border-top: 1px solid rgba(255,255,255,0.08);

    font-style: italic;

    opacity: 0.65;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width: 650px) {

    .archive {
        padding: 30px 15px 40px;
    }

    .map-container {
        aspect-ratio: 1 / 1;
    }

    .profile {
        grid-template-columns: 1fr;
    }

    .portrait,
    .portrait img {
        min-height: 210px;
    }

    .profile-content {
        padding: 30px;
    }

    .cycle-navigation {
        gap: 10px;
    }

    .cycle-title {
        min-width: 190px;
    }

}

</style>
</head>

<script>


/* =====================================================
   CYCLE DATA
===================================================== */

const months = [
    "June",
    "July",
    "August",
    "September",
    "October",
    "November"
];

let currentMonthIndex = 0;


/* =====================================================
   STUDENT DATA
=====================================================

   IMPORTANT:

   Rank 1–3:
   - bright stars
   - colored
   - photo hover

   Rank 0:
   - small star
   - name + identity hover

   Untuk foto, tinggal ganti:

   photo: "images/nicholette.jpg"

===================================================== */


const students = [

    /* =================================================
       JUNE
    ================================================= */

    {
        name: "Nicholette Rhodes",
        month: "June",
        rank: 1,

        /*
           BLUE STAR
        */
        color: "#72b7ff",

        photo: "images/nicholette.jpg",

        identity: "Rank I · June 2026",

        quote:
            "A brilliant blue star anchoring the June sky.",

        /*
           Main star of constellation
        */
        x: 300,

    },


    {

        month: "June",
        rank: 2,

        /*
           ORANGE STAR
        */
        color: "#ffad5c",

        photo: "images/naja.jpg",

        identity: "Rank II · June 2026",

        quote:
            "A warm orange light among the summer stars.",

        x: 470,
        y: 170
    },


    {
        name: "Kasper Alain Goth",
        month: "June",
        rank: 3,

        /*
           RED STAR
        */
        color: "#ff625f",

        photo: "images/kasper.jpg",

        identity: "Rank III · June 2026",

        quote:
            "A red star glowing at the edge of the constellation.",

        x: 675,
        y: 270
    },


    /* =================================================
       RANK 0
    ================================================= */

    {
        name: "Stella Hearts2Hearts",
        month: "June",
        rank: 0,

        color: "#dbe7ff",

        identity:
            "Recorded star · Hearts2Hearts",

        quote:
            "A newly recorded point of light.",

        x: 235,
        y: 340
    },


    {
        name: "Seunghyeon Cortis",
        month: "June",
        rank: 0,

        color: "#dbe7ff",

        identity:
            "Recorded star · CORTIS",

        quote:
            "A quiet star in the June sky.",

        x: 385,
        y: 355
    },


    {
        name: "Karina",
        month: "June",
        rank: 0,

        color: "#dbe7ff",

        identity:
            "Recorded star · aespa",

        quote:
            "A distant point of light.",

        x: 535,
        y: 330
    },


    {
        name: "Jeong Saebi IZNA",
        month: "June",
        rank: 0,

        color: "#dbe7ff",

        identity:
            "Recorded star · izna",

        quote:
            "A newly observed star.",

        x: 610,
        y: 385
    },


    {
        name: "Lee Dain",
        month: "June",
        rank: 0,

        color: "#dbe7ff",

        identity:
            "Recorded star · June Archive",

        quote:
            "A subtle point of light.",

        x: 760,
        y: 350
    },


    {
        name: "Park Minju",
        month: "June",
        rank: 0,

        color: "#dbe7ff",

        identity:
            "Recorded star · June Archive",

        quote:
            "A small light joining the constellation.",

        x: 810,
        y: 235
    },


    {
        name: "Juun H2H",
        month: "June",
        rank: 0,

        color: "#dbe7ff",

        identity:
            "Recorded star · Hearts2Hearts",

        quote:
            "A young star entering the archive.",

        x: 170,
        y: 255
    }

];


/* =====================================================
   CONSTELLATION CONNECTIONS — JUNE
=====================================================

   Ini BUKAN lagi:
   star 1 → star 2 → star 3 → star 4...

   Kita menentukan sendiri garis mana yang membentuk
   siluet konstelasi.

   Struktur Juni dibuat menyerupai pola summer sky:
   - garis utama
   - cabang kecil
   - beberapa bintang dibiarkan terpisah

===================================================== */

const constellationLines = {

    June: [

        /*
           Main structure
        */

        [0, 1, true],
        [1, 2, true],

        /*
           Left branch
        */

        [6, 0, false],
        [3, 0, false],

        /*
           Lower arc
        */

        [0, 4, false],
        [4, 5, false],
        [5, 7, false],

        /*
           Right structure
        */

        [1, 5, false],
        [5, 6, false],
        [6, 2, false],

        /*
           Small extension
        */

        [2, 7, false]

    ]

};


/* =====================================================
   SVG
===================================================== */

const svg =
    document.getElementById("constellation");


/* =====================================================
   TOOLTIP
===================================================== */

const tooltip =
    document.getElementById("star-tooltip");

const tooltipPhoto =
    document.getElementById("tooltip-photo");

const tooltipRank =
    document.getElementById("tooltip-rank");

const tooltipName =
    document.getElementById("tooltip-name");

const tooltipIdentity =
    document.getElementById("tooltip-identity");


function showTooltip(student, event) {

    tooltipName.textContent =
        student.name;

    tooltipIdentity.textContent =
        student.identity || "Recorded star";

    if (student.rank > 0) {

        tooltip.classList.remove("simple");

        tooltipPhoto.style.display =
            "block";

        /*
           Kalau fotonya belum tersedia,
           browser akan fallback ke background.
        */

        tooltipPhoto.src =
            student.photo || "";

        tooltipRank.textContent =
            `Rank #${student.rank}`;

    } else {

        tooltip.classList.add("simple");

        tooltipPhoto.style.display =
            "none";

        tooltipRank.textContent =
            "Recorded Star";

    }


    positionTooltip(event);

    tooltip.classList.add("visible");
}


function positionTooltip(event) {

    const padding = 18;

    let x =
        event.clientX + 18;

    let y =
        event.clientY + 18;


    const width =
        tooltip.offsetWidth || 230;

    const height =
        tooltip.offsetHeight || 160;


    if (
        x + width >
        window.innerWidth - padding
    ) {

        x =
            event.clientX -
            width -
            18;

    }


    if (
        y + height >
        window.innerHeight - padding
    ) {

        y =
            event.clientY -
            height -
            18;

    }


    tooltip.style.left =
        `${x}px`;

    tooltip.style.top =
        `${y}px`;
}


function hideTooltip() {

    tooltip.classList.remove(
        "visible"
    );
}


/* =====================================================
   DRAW CONSTELLATION
===================================================== */

function drawConstellation() {

    svg.innerHTML = "";

    const month =
        months[currentMonthIndex];


    const monthStudents =
        students.filter(
            student =>
                student.month === month
        );


    /*
       Hide empty message if there are stars.
    */

    document.getElementById(
        "empty-month"
    ).style.display =
        monthStudents.length
            ? "none"
            : "flex";


    /*
       Draw connections
    */

    const connections =
        constellationLines[month] || [];


    connections.forEach(
        connection => {

            const [
                indexA,
                indexB,
                major
            ] = connection;


            const studentA =
                students[indexA];

            const studentB =
                students[indexB];


            /*
               Safety check:
               only connect students
               from the current month.
            */

            if (
                !studentA ||
                !studentB ||
                studentA.month !== month ||
                studentB.month !== month
            ) {
                return;
            }


            const line =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "line"
                );


            line.setAttribute(
                "x1",
                studentA.x
            );

            line.setAttribute(
                "y1",
                studentA.y
            );

            line.setAttribute(
                "x2",
                studentB.x
            );

            line.setAttribute(
                "y2",
                studentB.y
            );


            line.setAttribute(
                "class",
                major
                    ? "constellation-line major"
                    : "constellation-line"
            );


            svg.appendChild(line);

        }
    );


    /*
       Draw stars
    */

    monthStudents.forEach(
        student => {

            const group =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "g"
                );


            group.setAttribute(
                "class",
                "star"
            );


            if (student.rank === 0) {

                group.classList.add(
                    "recorded-star"
                );

            }


            group.style.color =
                student.color;


            group.setAttribute(
                "transform",
                `translate(${student.x}, ${student.y})`
            );


            /*
               Glow
            */

            const glow =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "circle"
                );


            let glowRadius;


            if (student.rank === 1) {

                glowRadius = 24;

            } else if (
                student.rank === 2
            ) {

                glowRadius = 19;

            } else if (
                student.rank === 3
            ) {

                glowRadius = 16;

            } else {

                glowRadius = 9;

            }


            glow.setAttribute(
                "r",
                glowRadius
            );


            glow.setAttribute(
                "fill",
                student.color
            );


            glow.setAttribute(
                "opacity",
                student.rank
                    ? "0.16"
                    : "0.06"
            );


            /*
               Actual star
            */

            const star =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "circle"
                );


            let radius;


            if (student.rank === 1) {

                radius = 9;

            } else if (
                student.rank === 2
            ) {

                radius = 7;

            } else if (
                student.rank === 3
            ) {

                radius = 6;

            } else {

                radius = 3.5;

            }


            star.setAttribute(
                "r",
                radius
            );


            star.setAttribute(
                "fill",
                student.color
            );


            star.setAttribute(
                "stroke",
                "rgba(255,255,255,0.8)"
            );


            star.setAttribute(
                "stroke-width",
                student.rank
                    ? "1.2"
                    : "0.7"
            );


            group.appendChild(
                glow
            );

            group.appendChild(
                star
            );


            /*
               Bright star receives
               subtle cross flare.
            */

            if (student.rank > 0) {

                const flare =
                    document.createElementNS(
                        "http://www.w3.org/2000/svg",
                        "path"
                    );


                flare.setAttribute(
                    "d",
                    "M -16 0 L 16 0 M 0 -16 L 0 16"
                );


                flare.setAttribute(
                    "stroke",
                    student.color
                );


                flare.setAttribute(
                    "stroke-width",
                    "0.6"
                );


                flare.setAttribute(
                    "opacity",
                    "0.35"
                );


                group.appendChild(
                    flare
                );

            }


            /*
               HOVER
            */

            group.addEventListener(
                "mouseenter",
                event =>
                    showTooltip(
                        student,
                        event
                    )
            );


            group.addEventListener(
                "mousemove",
                event =>
                    positionTooltip(
                        event
                    )
            );


            group.addEventListener(
                "mouseleave",
                hideTooltip
            );


            /*
               CLICK
            */

            group.addEventListener(
                "click",
                () =>
                    openProfile(
                        student
                    )
            );


            svg.appendChild(
                group
            );

        }
    );

}


/* =====================================================
   UPDATE MONTH
===================================================== */

function updateMonth() {

    const month =
        months[currentMonthIndex];


    document.getElementById(
        "current-month"
    ).textContent =
        month.toUpperCase();


    document.getElementById(
        "month-corner"
    ).textContent =
        `${month} 2026`;


    /*
       Constellation subtitle
    */

    const constellationNames = {

        June:
            "Summer Sky · Northern Hemisphere",

        July:
            "Summer Sky · Northern Hemisphere",

        August:
            "Late Summer Sky · Northern Hemisphere",

        September:
            "Early Autumn Sky · Northern Hemisphere",

        October:
            "Autumn Sky · Northern Hemisphere",

        November:
            "Late Autumn Sky · Northern Hemisphere"

    };


    document.getElementById(
        "constellation-name"
    ).textContent =
        constellationNames[month];


    drawConstellation();

    hideTooltip();

}


/* =====================================================
   PREVIOUS / NEXT
===================================================== */

document
    .getElementById("previous")
    .addEventListener(
        "click",
        () => {

            currentMonthIndex--;

            if (
                currentMonthIndex < 0
            ) {

                currentMonthIndex =
                    months.length - 1;

            }

            updateMonth();

        }
    );


document
    .getElementById("next")
    .addEventListener(
        "click",
        () => {

            currentMonthIndex++;

            if (
                currentMonthIndex >=
                months.length
            ) {

                currentMonthIndex = 0;

            }

            updateMonth();

        }
    );


/* =====================================================
   PROFILE MODAL
===================================================== */

const modal =
    document.getElementById("modal");


function openProfile(student) {

    document.getElementById(
        "profile-name"
    ).textContent =
        student.name;


    document.getElementById(
        "profile-rank"
    ).textContent =
        student.rank
            ? `Rank #${String(student.rank).padStart(2,"0")} · ${student.month} 2026`
            : `Recorded Star · ${student.month} 2026`;


    document.getElementById(
        "profile-info"
    ).innerHTML =

        student.rank

        ? `
            Stellar Classification:
            <strong style="color:${student.color}">
                ${student.rank === 1
                    ? "Blue Star"
                    : student.rank === 2
                    ? "Orange Star"
                    : "Red Star"}
            </strong>

            <br>

            Celestial Cycle I
        `

        : `
            ${student.identity || "Recorded Star"}

            <br>

            Celestial Cycle I
        `;


    document.getElementById(
        "profile-quote"
    ).textContent =
        `“${student.quote}”`;


    /*
       Profile portrait
    */

    const portrait =
        document.getElementById(
            "portrait"
        );


    portrait.innerHTML = "";


    if (
        student.rank > 0 &&
        student.photo
    ) {

        const image =
            document.createElement("img");


        image.src =
            student.photo;


        image.alt =
            student.name;


        portrait.appendChild(
            image
        );

    } else {

        portrait.textContent =
            "RECORDED STAR";

    }


    modal.classList.add(
        "active"
    );

    hideTooltip();

}


/* =====================================================
   CLOSE MODAL
===================================================== */

document
    .getElementById("close")
    .addEventListener(
        "click",
        () =>
            modal.classList.remove(
                "active"
            )
    );


modal.addEventListener(
    "click",
    event => {

        if (
            event.target === modal
        ) {

            modal.classList.remove(
                "active"
            );

        }

    }
);


/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            modal.classList.remove(
                "active"
            );

            hideTooltip();

        }

    }
);


/* =====================================================
   INITIALIZE
===================================================== */

updateMonth();

</script>

</html>
